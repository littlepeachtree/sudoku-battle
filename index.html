<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --ink:#e2e8f0; --dim:#94a3b8;
    --accent:#38bdf8; --accent2:#0ea5e9; --gold:#fbbf24; --goldbg:#fef3c7;
    --danger:#f87171; --ok:#4ade80; --given:#cbd5e1;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:linear-gradient(160deg,#0f172a 0%,#1e293b 100%);
    color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; justify-content:center; min-height:100vh;
  }
  #app{width:100%; max-width:640px; padding:12px 12px 28px; display:flex; flex-direction:column; gap:10px;}
  header{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .title{font-size:18px; font-weight:800; letter-spacing:.5px;}
  .title .sub{font-size:11px; color:var(--dim); font-weight:500; margin-left:6px;}
  #statusBar{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--dim); background:var(--panel); border-radius:8px; padding:6px 10px; flex-wrap:wrap;}
  .dot{width:8px;height:8px;border-radius:50%;background:#64748b;display:inline-block;flex:none;}
  .dot.on{background:var(--ok); box-shadow:0 0 6px var(--ok);}
  .dot.err{background:var(--danger);}
  .dot.room{background:var(--accent);}
  #roomTag{font-family:ui-monospace,Menlo,monospace;}
  #warnBanner{display:none; background:#7c2d12; color:#fed7aa; border-radius:8px; padding:8px 10px; font-size:12px; line-height:1.5;}
  #warnBanner button{margin-left:6px; background:#fbbf24; color:#1f2937; border:none; border-radius:6px; padding:4px 10px; font-size:12px; cursor:pointer;}

  /* 对战双方卡片 */
  .players{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .pcard{background:var(--panel); border-radius:10px; padding:8px 12px; border:1px solid #334155;}
  .pcard .who{font-size:11px; color:var(--dim); margin-bottom:2px;}
  .pcard .nm{font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pcard .tm{font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--accent); margin-top:2px;}
  .pcard.opp .tm{color:var(--dim);}
  .pcard .st{font-size:11px; color:var(--dim); margin-top:1px; min-height:14px;}
  .pcard.me{border-color:var(--accent2);}
  .pcard.opp.racing{border-color:#475569;}
  .pcard.opp.finished{border-color:var(--danger);}
  .pcard.opp.winner{border-color:var(--gold);}

  /* 棋盘 */
  #boardWrap{background:var(--panel); border-radius:12px; padding:10px; box-shadow:0 6px 24px rgba(0,0,0,.35);}
  #board{display:grid; grid-template-columns:repeat(9,1fr); background:#334155; gap:1px; border:2px solid #475569; border-radius:6px; overflow:hidden; user-select:none;}
  .cell{position:relative; aspect-ratio:1; background:#f8fafc; color:#0f172a; display:flex; align-items:center; justify-content:center; font-size:clamp(16px,5.2vw,26px); font-weight:700; cursor:pointer;}
  .cell.given{background:#e2e8f0; color:#334155; font-weight:800;}
  .cell.hinted{background:var(--goldbg); color:#92400e;}
  .cell.conflict{color:var(--danger);}
  .cell.conflict.given{color:var(--danger);}
  .cell.sel{outline:3px solid var(--accent); outline-offset:-2px; z-index:2; background:#e0f2fe;}
  .cell.given.sel{outline:3px solid var(--accent2);}
  .cell.bl{box-shadow:inset -2px 0 0 #475569;}  /* 右粗线(列) */
  .cell.bt{box-shadow:inset 0 -2px 0 #475569;}  /* 下粗线(行) */
  .cell.bl.bt{box-shadow:inset -2px -2px 0 #475569;}
  .cell .notes{position:absolute; inset:1px; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); font-size:clamp(8px,2.6vw,12px); font-weight:600; color:#64748b; padding:1px;}
  .cell .notes span{display:flex; align-items:center; justify-content:center;}
  .cell .notes span.on{color:var(--accent2); font-weight:800;}
  .cell.locked{cursor:not-allowed;}

  /* 侧栏 */
  #side{display:flex; flex-direction:column; gap:8px;}
  .pad{display:grid; grid-template-columns:repeat(5,1fr); gap:6px;}
  .pad button{height:46px; border-radius:9px; border:none; font-size:20px; font-weight:800; background:var(--panel2); color:var(--ink); cursor:pointer; border:1px solid #334155;}
  .pad button:active{transform:scale(.96);}
  .pad button.tool{font-size:13px; font-weight:700; color:var(--dim);}
  .pad button.tool.act{color:var(--accent); border-color:var(--accent);}
  .pad button:disabled{opacity:.35; cursor:not-allowed;}
  .btns{display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
  .btns button{height:40px; border-radius:9px; border:1px solid #334155; background:var(--panel); color:var(--ink); font-size:13px; font-weight:700; cursor:pointer;}
  .btns button:active{transform:scale(.97);}
  .btns button:disabled{opacity:.35; cursor:not-allowed;}
  #hintBtn .cnt{color:var(--gold); font-weight:900;}
  #surrBtn{color:var(--danger);}
  .diffrow{display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
  .diffrow button{height:34px; border-radius:8px; border:1px solid #334155; background:transparent; color:var(--dim); font-size:13px; cursor:pointer;}
  .diffrow button.on{background:var(--accent2); color:#fff; border-color:var(--accent2); font-weight:700;}
  .diffrow button:disabled{opacity:.4; cursor:not-allowed;}
  .hintline{font-size:11px; color:var(--dim); text-align:center;}

  /* 覆盖层 */
  .overlay{position:fixed; inset:0; background:rgba(2,6,23,.82); display:none; align-items:center; justify-content:center; z-index:50; flex-direction:column; gap:10px;}
  .overlay.show{display:flex;}
  #countdownNum{font-size:120px; font-weight:900; color:var(--gold); text-shadow:0 0 30px rgba(251,191,36,.6);}
  #countdownSub{font-size:16px; color:var(--dim);}
  #resultBox{text-align:center; background:var(--panel); border-radius:16px; padding:30px 40px; border:1px solid #334155; max-width:86%; position:relative; z-index:0;}
  #resultImage{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.45; z-index:1; pointer-events:none; display:none;}
  #resultBtnWrap{position:absolute; bottom:9%; left:0; right:0; text-align:center; z-index:2;}
  #resultBtn{font-size:17px; font-weight:800; padding:13px 46px; border-radius:14px; background:linear-gradient(135deg,#f59e0b,#f97316); color:#0f172a; border:none; cursor:pointer; box-shadow:0 4px 18px rgba(245,158,11,.4);}
  #resultTitle{font-size:44px; font-weight:900; letter-spacing:2px;}
  #resultTitle.win{color:var(--gold); text-shadow:0 0 24px rgba(251,191,36,.5);}
  #resultTitle.lose{color:#94a3b8;}
  #resultTitle.done{color:var(--ok);}
  #resultSub{margin-top:8px; font-size:16px; color:var(--dim);}
  #resultBtn{margin-top:18px; padding:10px 28px; border:none; border-radius:10px; background:var(--accent2); color:#fff; font-size:15px; font-weight:700; cursor:pointer;}
  #modal{position:fixed; inset:0; background:rgba(2,6,23,.8); display:none; align-items:center; justify-content:center; z-index:60;}
  #modal.show{display:flex;}
  .mcard{background:var(--panel); border-radius:14px; padding:22px; width:min(320px,86%); text-align:center; border:1px solid #334155;}
  .mcard h3{margin:0 0 12px; font-size:17px;}
  .mcard input{width:100%; padding:10px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:var(--ink); font-size:15px; margin-bottom:12px; text-align:center;}
  .mcard .row{display:flex; gap:8px;}
  .mcard .row button{flex:1; height:38px; border:none; border-radius:8px; font-size:14px; cursor:pointer;}
  #modalOk{background:var(--accent2); color:#fff; font-weight:700;}
  #modalCancel{background:#334155; color:var(--dim);}
  #toast{position:fixed; left:50%; bottom:34px; transform:translateX(-50%); background:#0f172a; color:var(--ink); border:1px solid #334155; border-radius:10px; padding:9px 16px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:80; max-width:90%; text-align:center;}
  .big-sit{font-size:17px; font-weight:800; padding:13px 44px; border-radius:14px; background:linear-gradient(135deg,#f59e0b,#f97316); color:#0f172a; border:none; cursor:pointer; box-shadow:0 4px 16px rgba(245,158,11,.35);}
  .big-sit:disabled{background:#334155; color:#94a3b8; box-shadow:none; cursor:default;}
  #toast.show{opacity:1;}
  #genOverlay{position:fixed; inset:0; background:rgba(2,6,23,.7); display:none; align-items:center; justify-content:center; z-index:70; color:var(--dim); font-size:14px;}
  #genOverlay.show{display:flex;}
  @media (min-width:700px){
    #main{display:grid; grid-template-columns:1fr 210px; gap:12px; align-items:start;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">数独对战<span class="sub">SUDOKU BATTLE</span></div>
    <div id="diffLabel" class="hintline" style="text-align:right;"></div>
  </header>

  <div id="statusBar">
    <span class="dot" id="connDot"></span>
    <span id="connText">连接中…</span>
    <span style="flex:1"></span>
    <span>房间</span><span id="roomTag" style="color:var(--accent)">—</span>

// ================= 注入的题目数据 =================
let INJECTED = null;
try { INJECTED = JSON.parse('{"seed": "ng1xrx44", "difficulty": "medium", "difficultyLabel": "中等", "puzzle": [[9, 2, 4, 0, 8, 0, 6, 0, 0], [0, 0, 0, 0, 0, 6, 0, 0, 0], [0, 6, 5, 2, 9, 0, 0, 4, 1], [0, 0, 9, 8, 0, 2, 0, 1, 0], [8, 0, 0, 7, 1, 0, 2, 0, 0], [1, 4, 0, 0, 5, 9, 0, 0, 0], [0, 0, 1, 5, 6, 0, 7, 3, 4], [0, 0, 0, 0, 0, 1, 9, 0, 8], [0, 8, 0, 0, 0, 3, 0, 0, 2]], "solution": [[9, 2, 4, 1, 8, 5, 6, 7, 3], [7, 1, 8, 3, 4, 6, 5, 2, 9], [3, 6, 5, 2, 9, 7, 8, 4, 1], [6, 7, 9, 8, 3, 2, 4, 1, 5], [8, 5, 3, 7, 1, 4, 2, 9, 6], [1, 4, 2, 6, 5, 9, 3, 8, 7], [2, 9, 1, 5, 6, 8, 7, 3, 4], [5, 3, 7, 4, 2, 1, 9, 6, 8], [4, 8, 6, 9, 7, 3, 1, 5, 2]], "gameId": "20260907-011447-ny6b", "givens": 36}'); } catch (e) { INJECTED = null; }

// ================= 客户端数独生成器（与 scripts/generate_sudoku.py 逐位一致） =================
// @@SUDOKU_CORE_BEGIN@@
function hashSeed(s){
  let h = (1779033703 ^ s.length) >>> 0;
  for (let i = 0; i < s.length; i++){
    h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
    h = ((h << 13) | (h >>> 19)) >>> 0;
  }
  h = Math.imul(h ^ (h >>> 16), 2246822507);
  h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^ (h >>> 16)) >>> 0;
}
function splitmix32(a){
  return function(){
    a = (a + 0x9E3779B9) | 0;
    let t = a ^ (a >>> 16);
    t = Math.imul(t, 0x21F0AAAD);
    t = t ^ (t >>> 15);
    t = Math.imul(t, 0x735A2D97);
    t = t ^ (t >>> 15);
    return ((t >>> 0) / 4294967296);
  };
}
function makeRng(seedStr){ return splitmix32(hashSeed(seedStr)); }
function shuffle(arr, rng){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function isValidCell(grid, r, c, d){
  for (let i = 0; i < 9; i++){
    if (grid[r][i] === d || grid[i][c] === d) return false;
  }
  const br = Math.floor(r / 3) * 3, bc = Math.floor(c / 3) * 3;
  for (let i = 0; i < 3; i++)
    for (let j = 0; j < 3; j++)
      if (grid[br + i][bc + j] === d) return false;
  return true;
}
function solveFull(grid, rng){
  for (let r = 0; r < 9; r++){
    for (let c = 0; c < 9; c++){
      if (grid[r][c] === 0){
        const digits = shuffle([1,2,3,4,5,6,7,8,9], rng);
        for (const d of digits){
          if (isValidCell(grid, r, c, d)){
            grid[r][c] = d;
            if (solveFull(grid, rng)) return true;
            grid[r][c] = 0;
          }
        }
        return false;
      }
    }
  }
  return true;
}
function countSolutions(grid, limit){
  // MRV：每次选候选数最少的空格分支（并列取行优先第一个）；候选为 0 即死路。
  // 与 generate_sudoku.py 的 count_solutions 逐位一致（不消耗 rng）。
  let count = 0;
  function bt(){
    if (count >= limit) return;
    let best = null, bestCands = null;
    for (let r = 0; r < 9; r++){
      for (let c = 0; c < 9; c++){
        if (grid[r][c] === 0){
          const cands = [];
          for (let d = 1; d <= 9; d++) if (isValidCell(grid, r, c, d)) cands.push(d);
          if (cands.length === 0) return;
          if (bestCands === null || cands.length < bestCands.length){ best = [r, c]; bestCands = cands; }
        }
      }
    }
    if (best === null){ count++; return; }
    const r = best[0], c = best[1];
    for (const d of bestCands){
      grid[r][c] = d;
      bt();
      grid[r][c] = 0;
      if (count >= limit) return;
    }
  }
  bt();
  return count;
}
function digPuzzle(full, rng, targetGivens){
  const positions = [];
  for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) positions.push([r, c]);
  shuffle(positions, rng);
  const puzzle = full.map(row => row.slice());
  let givens = 81;
  for (const [r, c] of positions){
    if (givens <= targetGivens) break;
    const backup = puzzle[r][c];
    puzzle[r][c] = 0;
    if (countSolutions(puzzle, 2) === 1) givens--;
    else puzzle[r][c] = backup;
  }
  return puzzle;
}
const DIFF_RANGES_JS = { easy:[40,45], medium:[32,38], hard:[26,31], expert:[22,25] };
function generatePuzzle(seedStr, difficulty){
  // 与 generate_sudoku.py 的 generate() 逐位一致：挖空未达目标时用派生 seed 重试最多 7 次。
  const [lo, hi] = DIFF_RANGES_JS[difficulty];
  let puzzle = null, full = null, givens = 81;
  for (let attempt = 0; attempt < 7; attempt++){
    const s = attempt === 0 ? seedStr : seedStr + '#r' + attempt;
    const rng = makeRng(s);
    const f = Array.from({length:9}, () => Array(9).fill(0));
    if (!solveFull(f, rng)) throw new Error('solve failed');
    const target = lo + Math.floor(rng() * (hi - lo + 1));
    const p = digPuzzle(f, rng, target);
    let g = 0;
    for (const row of p) for (const v of row) if (v !== 0) g++;
    puzzle = p; full = f; givens = g;
    if (g <= hi) break;
  }
  return { puzzle, solution: full, givens };
}
// @@SUDOKU_CORE_END@@

// ================= MQTT 配置 =================
const MQTT_CDNS = [

function fmt(ms){ const s = Math.floor(ms / 1000); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }

// ================= 房间 / 昵称解析 =================
// APP 分享 HTML 文件时注入的固定房间号（对方打开文件即进入同一房间）
const DEFAULT_ROOM = "";
function deriveRoomFromUrl(){
  // URL 兜底：同一页面地址推导出同一房间（微信/部分 App 剥掉参数时仍可配对）
  const s = location.pathname || 'sudoku';
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return 'auto' + Math.abs(h).toString(36);
}
function getRoom(){
  // 房间固定为「北临空」（淘子树 vs 沙莎 专用对战间）
  return '北临空';
}
function resolveName(){
  const n = params.get('name') || params.get('nickname') || params.get('wxname');
  if (n) return n;
  try { const saved = localStorage.getItem('sb_name'); if (saved) return saved; } catch(e){}

// ================= 游戏状态 =================
const S = {
  room: getRoom(),
  myCid: uid(),
  myName: resolveName() || ('玩家' + Math.floor(1000 + Math.random() * 9000)),
  peer: null,            // {cid,name}
  peerKnown: false,
  mySit: false, peerSit: false,   // 坐下机制：双方都坐下才开局
  isHost: false,
  firstJoinTs: 0,
  startedSent: false,
  state: 'init',         // init|single|waiting|countdown|racing|finished
  mqtt: null, brokerName: null, mqttOnline: false,
  seed: null, difficulty: 'medium',
  puzzle: null, solution: null, givens: 0,
  board: [],             // 81 × {v,given,hinted,notes:Set}
  selected: null,
  notesMode: false,
  hintsLeft: 3,
  myMs: 0, peerMs: null, timerInt: null, tickInt: null, peerTicks: {},

};

const DIFF_LABELS = { easy:'简单', medium:'中等', hard:'困难', expert:'专家' };

// ================= 棋盘渲染 =================
function buildBoardFromPuzzle(){
  S.board = [];
  for (let i = 0; i < 81; i++){
    const v = S.puzzle[Math.floor(i / 9)][i % 9];
    S.board.push({ v, given: v !== 0, hinted: false, notes: new Set() });
  }
  S.selected = null;
  S.hintsLeft = 3;
  $('hintCnt').textContent = '×' + S.hintsLeft;
  $('hintBtn').disabled = false;
  renderBoard();
}
function cellConflict(idx){
  const b = S.board[idx]; if (!b.v) return false;
  const r = Math.floor(idx / 9), c = idx % 9;
  for (let i = 0; i < 9; i++){
    if (i !== c && S.board[r * 9 + i].v === b.v) return true;
    if (i !== r && S.board[i * 9 + c].v === b.v) return true;
  }
  const br = Math.floor(r / 3) * 3, bc = Math.floor(c / 3) * 3;
  for (let i = 0; i < 3; i++)
    for (let j = 0; j < 3; j++){
      const rr = br + i, cc = bc + j;
      if ((rr !== r || cc !== c) && S.board[rr * 9 + cc].v === b.v) return true;
    }
  return false;
}
function renderBoard(){
  const el = $('board'); el.innerHTML = '';
  for (let i = 0; i < 81; i++){
    const b = S.board[i];
    const d = document.createElement('div');
    d.className = 'cell';
    const r = Math.floor(i / 9), c = i % 9;
    if (b.given) d.classList.add('given');
    if (b.hinted) d.classList.add('hinted');
    if (c % 3 === 2 && c !== 8) d.classList.add('bl');
    if (r % 3 === 2 && r !== 8) d.classList.add('bt');
    if (S.selected === i) d.classList.add('sel');
    if (!b.given && !b.hinted && b.v && cellConflict(i)) d.classList.add('conflict');
    if (b.given || b.hinted) d.classList.add('locked');
    if (b.v){
      d.textContent = b.v;
    } else if (b.notes.size){
      const n = document.createElement('div'); n.className = 'notes';
      for (let k = 1; k <= 9; k++){
        const sp = document.createElement('span');
        if (b.notes.has(k)){ sp.textContent = k; sp.classList.add('on'); }
        n.appendChild(sp);
      }
      d.appendChild(n);
    }
    d.addEventListener('click', () => { S.selected = i; renderBoard(); });
    el.appendChild(d);
  }
}
function boardInputAllowed(){ return S.state === 'racing' || S.state === 'single'; }

// ================= 落子 / 笔记 / 擦除 / 提示 =================
function setValue(idx, n){
  const b = S.board[idx];
  if (!boardInputAllowed() || !b || b.given || b.hinted) return;
  if (S.notesMode){
    if (b.notes.has(n)) b.notes.delete(n); else b.notes.add(n);
    b.v = 0;
  } else {
    b.v = n; b.notes.clear();
  }
  renderBoard();
  if (S.state === 'racing') checkComplete();
  else if (S.state === 'single') checkComplete();
}
function eraseCell(){
  if (!boardInputAllowed()) return;
  if (S.selected === null) return;
  const b = S.board[S.selected];
  if (b.given || b.hinted) return;
  b.v = 0; b.notes.clear(); renderBoard();
}
function doHint(){
  if (!boardInputAllowed() || S.hintsLeft <= 0) return;
  for (let i = 0; i < 81; i++){
    const b = S.board[i];
    if (b.given || b.hinted) continue;
    if (b.v === S.solution[Math.floor(i / 9)][i % 9]) continue; // 当前值正确不算“错误”
    b.v = S.solution[Math.floor(i / 9)][i % 9];
    b.hinted = true; b.notes.clear();
    S.hintsLeft--;
    $('hintCnt').textContent = '×' + S.hintsLeft;
    if (S.hintsLeft <= 0) $('hintBtn').disabled = true;
    toast('已填入提示数字', 1200);
    renderBoard();
    return;
  }
  toast('没有需要提示的格子了', 1800);
}

// ================= 胜负判定 =================
function checkComplete(){
  for (let i = 0; i < 81; i++){
    const b = S.board[i];
    if (!b.v) return;
    if (b.v !== S.solution[Math.floor(i / 9)][i % 9]) return;
  }
  completeGame();
}
function completeGame(){
  if (S.state === 'finished') return;
  S.state = 'finished';
  S.finishedAt = Date.now();
  stopTimers();
  if (S.stateWasSingle){
    showResult('done', '🎉 完成！', '用时 ' + fmt(S.myMs));
    return;
  }
  const ms = S.myMs;
  if (S.mqttOnline && S.peerDoneMs !== null){
    // 对手已完成先到 → 我输
    showResult('lose', 'LOSER', '对手先完成（' + fmt(S.peerDoneMs) + '），再接再厉！');
  } else {
    publish({ type: 'done', cid: S.myCid, ms });
    showResult('win', 'WINNER 🏆', '用时 ' + fmt(ms) + '，先完成且全部正确！');
  }
}
function handlePeerDone(ms){
  S.peerDoneMs = ms;
  if (S.state === 'racing' || S.state === 'countdown'){
    stopTimers();
    S.state = 'finished';
    showResult('lose', 'LOSER', '对手先完成（' + fmt(ms) + '），再接再厉！');
  }
  setOppState('已完成 ' + fmt(ms));

function showResult(kind, title, sub){
  // 结算画面不显示 WINNER/LOSER 文字：只播表情图 + 下方中部「再来一局」
  const btn = $('resultBtn');
  btn.style.display = (S.stateWasSingle || kind === 'win' || kind === 'lose') ? 'inline-block' : 'none';
  btn.textContent = (S.stateWasSingle) ? '再来一局' : '再来一局';
  // 结果表情：WINNER 显示庆祝图，LOSER 显示失落图，半透明铺满屏幕
  const img = $('resultImage');
  if (img){
    if (kind === 'win' || kind === 'lose'){
      img.src = (kind === 'win') ? WINNER_IMAGE : LOSER_IMAGE;
      img.style.display = 'block';
    } else {
      img.style.display = 'none';
      img.removeAttribute('src');
    }
  }
  $('resultOv').classList.add('show');
}
function closeResult(){
  $('resultOv').classList.remove('show');
  const img = $('resultImage');
  if (img){ img.removeAttribute('src'); img.style.display = 'none'; }
}

// ================= 计时 =================
function stopTimers(){
  clearInterval(S.timerInt); clearInterval(S.tickInt); S.timerInt = S.tickInt = null;
}
function startTimers(){
  stopTimers();
  S.myMs = 0;
  S.timerInt = setInterval(() => {
    S.myMs += 100;
    $('myTimer').textContent = fmt(S.myMs);
  }, 100);
  if (S.mqttOnline && !S.stateWasSingle){
    S.tickInt = setInterval(() => publish({ type: 'tick', cid: S.myCid, ms: S.myMs }), 1000);
  }
}

// ================= 倒计时 / 开新局 =================
function applyNewGame(seed, difficulty, { withCountdown } = {}){
  S.seed = seed; S.difficulty = difficulty;
  if (S.injectedSeed === seed && S.injectedDiff === difficulty && S.puzzle){
    // 与注入题一致：直接复用注入棋盘（避免重复生成）
  } else {
    const g = generatePuzzle(seed, difficulty);
    S.puzzle = g.puzzle; S.solution = g.solution; S.givens = g.givens;
  }
  S.hintsLeft = 3; $('hintCnt').textContent = '×3'; $('hintBtn').disabled = false;
  buildBoardFromPuzzle();
  updateDiffUI();
  if (withCountdown){
    S.state = 'countdown';
    countdownToStart();
  } else {
    S.state = S.stateWasSingle ? 'single' : 'racing';
    if (S.state === 'racing'){ startTimers(); setOppState('对战中'); setMyState('对战中'); }
    else { startTimers(); setMyState('练习中'); setOppState('单人练习'); }
  }
}
function countdownToStart(){
  closeResult();
  const sr = $('sitRow'); if (sr) sr.style.display = 'none';   // 开局后隐藏坐下按钮
  let n = 3;
  $('countdownNum').textContent = n;
  $('countdownSub').textContent = '准备对战';
  $('countdownOv').classList.add('show');
  const iv = setInterval(() => {
    n--;
    if (n > 0){ $('countdownNum').textContent = n; $('countdownSub').textContent = '准备对战'; }
    else {
      clearInterval(iv);
      $('countdownNum').textContent = 'GO!';
      $('countdownSub').textContent = '开始解题！';
      setTimeout(() => {
        $('countdownOv').classList.remove('show');
        S.state = 'racing';
        startTimers();
        setMyState('对战中');
        setOppState('对战中');
      }, 600);
    }
  }, 1000);
}

// ================= 玩家卡片 / 状态 =================
function setMyState(t){ $('myStateTxt').textContent = t; }
function setOppState(t){ $('oppStateTxt').textContent = t; }
function renderPlayers(){
  $('myNameTxt').textContent = S.myName;
  $('oppNameTxt').textContent = S.peer ? S.peer.name : '等待对手…';
  if (S.peer) $('oppCard').classList.add('paired'); 
  // 坐下状态展示
  if (S.mySit) setMyState('已坐下');
  if (S.peerSit) setOppState('已坐下');
}

// ================= MQTT 通信 =================
function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}
async function ensureMqttLib(){
  if (window.mqtt) return true;
  for (const src of MQTT_CDNS){
    try { await loadScript(src); if (window.mqtt) return true; } catch (e) {}
  }
  return !!window.mqtt;
}
function setConn(ok, txt){
  const dot = $('connDot'), tx = $('connText');
  if (ok === true){ dot.className = 'dot on'; tx.textContent = txt || '在线'; }
  else if (ok === false){ dot.className = 'dot err'; tx.textContent = txt || '离线'; }
  else { dot.className = 'dot'; tx.textContent = txt || '连接中…'; }
}
function topic(){ return 'sudoku/battle/' + S.room; }
function publish(obj){
  if (!S.mqttOnline || !S.mqtt) return;
  try { S.mqtt.publish(topic(), JSON.stringify(obj), { qos: 0 }); } catch (e) {}
}
async function connectMQTT(){ return connectMQTTFrom(0); }
async function connectMQTTFrom(startIdx){
  if (!(await ensureMqttLib())){ enterSingle('无法加载实时通信库，已进入单人练习'); return; }
  const order = [];
  for (let i = 0; i < BROKERS.length; i++) order.push(BROKERS[(startIdx + i) % BROKERS.length]);
  for (const b of order){
    await new Promise(r => setTimeout(r, 200));
    try {
      const client = mqtt.connect(b.url, {
        clientId: 'sb_' + S.myCid,
        clean: true, connectTimeout: 10000, reconnectPeriod: 0, keepalive: 30
      });
      await new Promise((res, rej) => {
        client.once('connect', res);
        client.once('error', rej);
      });
      S.mqtt = client; S.brokerName = b.name; S.mqttOnline = true;
      setConn(true, '在线 · ' + b.name);
      client.subscribe(topic(), { qos: 0 }, () => {});
      client.on('message', onMessage);
      client.on('close', () => {
        if (S.mqttOnline){
          S.mqttOnline = false;
          setConn(false, '连接断开');
          $('warnText').textContent = '连接已断开：可继续本地完成，或刷新页面重试。';
          $('warnBanner').style.display = 'flex';
          if (S.state === 'waiting') enterSingle('连接断开，已进入单人练习');
        }
      });
      client.on('error', () => {});
      return;
    } catch (e) {
      setConn(false, b.name + ' 不可用，切换中…');
    }
  }
  enterSingle('公共服务器均不可用，已进入单人练习');
}
function enterSingle(reason){
  if (S.state === 'single') return;
  S.stateWasSingle = true;
  S.mqttOnline = false;
  if (S.mqtt){ try { S.mqtt.end(true); } catch(e){} S.mqtt = null; }
  setConn(false, '单人练习');
  $('roomTag').textContent = 'SOLO';
  stopTimers(); clearInterval(S.joinTimer);
  if (reason) toast(reason, 3200);
  S.state = 'single';
  setMyState('练习中');
  setOppName('单人练习');
  setOppState('本地判胜');
  $('oppTimer').textContent = '--:--';
  if (!S.puzzle){
    S.seed = randomSeed(); S.difficulty = S.difficulty || 'medium';
    const g = generatePuzzle(S.seed, S.difficulty);
    S.puzzle = g.puzzle; S.solution = g.solution; S.givens = g.givens;
    buildBoardFromPuzzle();
    updateDiffUI();
  }
  // 单人模式：显示坐下按钮，点坐下即开局
  const sr = $('sitRow'); if (sr) sr.style.display = 'block';
  const sb = $('sitBtn');
  if (sb){ sb.disabled = S.mySit; sb.textContent = S.mySit ? '已坐下 ✓' : '🪑 坐下'; }
  renderBoard();
  startTimers();
  setMyState('练习中');
  $('singleBtn').style.display = 'none';
}

// ================= 消息处理 =================
function onMessage(t, payload){
  let m;
  try { m = JSON.parse(payload.toString()); } catch (e) { return; }
  if (m.cid === S.myCid) return;
  switch (m.type){
    case 'join': handleJoin(m); break;
    case 'sit': handleSit(m); break;
    case 'config': handleConfig(m); break;
    case 'start': handleStart(m); break;
    case 'tick': handleTick(m); break;
    case 'done': handlePeerDone(m.ms); break;
    case 'surrender': handlePeerSurrender(m); break;
    case 'restart': handleRestartMsg(m); break;
  }
}
function handleJoin(m){
  const isNewPeer = !S.peer || S.peer.cid !== m.cid;
  S.peer = { cid: m.cid, name: m.name || '对手' };
  S.peerKnown = true;
  renderPlayers();
  if (isNewPeer){
    // 角色判定：先加入（ts 更小）者为房主；ts 相同按 cid 字典序兜底
    const myTs = S.firstJoinTs || Date.now();
    const otherTs = m.ts || Date.now();
    const host = (myTs < otherTs) || (myTs === otherTs && S.myCid < m.cid);
    S.isHost = host;
    // 坐下机制：双方都坐下后由房主开局；对局中对手重连则房主重发 start 同步
    checkBothSat();
    if ((S.state === 'countdown' || S.state === 'racing') && S.isHost){
      sendStart();
    }
  }
}
function handleSit(m){
  S.peerSit = true;
  setOppState('已坐下');
  if (S.peer) renderPlayers();
  checkBothSat();
}
function sitDown(){
  if (S.mySit) return;
  S.mySit = true;
  const b = $('sitBtn');
  if (b){ b.disabled = true; b.textContent = '已坐下 ✓'; }
  setMyState('已坐下');
  publish({ type: 'sit', cid: S.myCid, name: S.myName, ts: Date.now() });
  if (S.state === 'single' || !S.peerKnown){
    // 单人/离线：坐下即开局
    applyNewGame(S.seed, S.difficulty, { withCountdown: true });
    return;
  }
  checkBothSat();
}
function checkBothSat(){
  if (S.mySit && S.peerSit && S.state === 'waiting' && S.isHost){
    sendStart();
  }
}
function sendStart(){
  if (S.state === 'finished') return;
  S.startedSent = true;
  setOppState('已就位');
  const payload = {
    type: 'start', cid: S.myCid, hostName: S.myName,
    guestName: S.peer ? S.peer.name : '',
    seed: S.seed, difficulty: S.difficulty, ts: Date.now()
  };
  for (let i = 0; i < 2; i++) publish(payload);
  applyNewGame(S.seed, S.difficulty, { withCountdown: true });
}
function handleStart(m){
  S.peer = { cid: m.cid, name: m.hostName || '对手' };
  S.peerKnown = true;
  renderPlayers();
  S.isHost = false;
  setOppState('已就位');
  applyNewGame(m.seed, m.difficulty, { withCountdown: true });
}
function handleConfig(m){
  if (S.state !== 'waiting') return;
  if (m.seed === S.seed && m.difficulty === S.difficulty) return;
  S.seed = m.seed; S.difficulty = m.difficulty;
  const g = generatePuzzle(m.seed, m.difficulty);
  S.puzzle = g.puzzle; S.solution = g.solution; S.givens = g.givens;
  buildBoardFromPuzzle();
  updateDiffUI();
  toast('对手已切换难度：' + DIFF_LABELS[m.difficulty], 1600);
}
function handleTick(m){
  S.peerMs = m.ms;
  $('oppTimer').textContent = fmt(m.ms);
  if (S.state === 'racing') setOppState('对战中');
}
function handlePeerSurrender(m){
  if (S.state === 'finished') return;
  stopTimers();
  S.state = 'finished';
  showResult('win', 'WINNER 🏆', m.name + ' 已认输，你获胜！');
  setOppState('已认输');
}

// ================= 重开 / 认输 =================
function doRestart(){
  if (S.stateWasSingle || !S.mqttOnline){
    const seed = randomSeed();
    applyNewGame(seed, S.difficulty, {});
    setMyState('练习中');
    return;
  }
  if (S.isHost){
    const seed = randomSeed();
    const payload = { type: 'restart', cid: S.myCid, host: true, seed, difficulty: S.difficulty };
    for (let i = 0; i < 2; i++) publish(payload);
    applyNewGame(seed, S.difficulty, { withCountdown: true });
  } else {
    publish({ type: 'restart', cid: S.myCid, ask: true });
    toast('已向房主发起重开请求…', 2000);
  }
}
function handleRestartMsg(m){
  if (m.ask){
    // 房主收到客人请求 → 确认
    if (!S.isHost) return;
    if (confirm('对方请求重开一局，是否同意？')){
      const seed = randomSeed();
      const payload = { type: 'restart', cid: S.myCid, host: true, seed, difficulty: S.difficulty };
      for (let i = 0; i < 2; i++) publish(payload);
      applyNewGame(seed, S.difficulty, { withCountdown: true });
    } else {
      publish({ type: 'restart', cid: S.myCid, decline: true });
    }
    return;
  }
  if (m.decline){ toast('房主拒绝了重开请求', 2000); return; }
  if (m.host){
    applyNewGame(m.seed, m.difficulty, { withCountdown: true });
  }
}
let surrConfirm = false, surrTimer = null;
function doSurrender(){
  if (S.state !== 'racing' && S.state !== 'countdown' && S.state !== 'single') return;
  if (!surrConfirm){
    surrConfirm = true;
    $('surrBtn').textContent = '确认认输？';
    toast('再次点击确认认输', 1800);
    clearTimeout(surrTimer);
    surrTimer = setTimeout(() => { surrConfirm = false; $('surrBtn').textContent = '认输'; }, 3000);
    return;
  }
  surrConfirm = false;
  $('surrBtn').textContent = '认输';
  const ms = S.myMs;
  stopTimers();
  S.state = 'finished';
  if (S.stateWasSingle){
    showResult('lose', '认输', '本次练习已结束');
  } else {
    publish({ type: 'surrender', cid: S.myCid, name: S.myName, ms });
    showResult('lose', 'LOSER', '你已认输');
    setOppState('等待判定');
  }
}

// ================= 难度切换 =================
function updateDiffUI(){
  document.querySelectorAll('#diffRow button').forEach(b => {
    b.classList.toggle('on', b.dataset.diff === S.difficulty);
  });
  $('diffLabel').textContent = DIFF_LABELS[S.difficulty] + ' · 已给 ' + S.givens + ' 格';
}
function changeDifficulty(diff){
  if (diff === S.difficulty) return;
  if (S.state === 'racing' || S.state === 'countdown' || S.state === 'finished'){
    toast('对局中无法换难度，请使用「重开一局」', 2200);
    return;
  }
  if (S.state === 'single' || S.stateWasSingle){
    S.difficulty = diff;
    const seed = randomSeed();
    applyNewGame(seed, diff, {});
    setMyState('练习中');
    return;
  }
  // waiting（对战等待期）→ 本地换题并广播 config 4 次防丢
  S.difficulty = diff;
  const seed = randomSeed();
  S.seed = seed;
  const g = generatePuzzle(seed, diff);
  S.puzzle = g.puzzle; S.solution = g.solution; S.givens = g.givens;
  buildBoardFromPuzzle();
  updateDiffUI();
  const payload = { type: 'config', cid: S.myCid, seed, difficulty: diff };
  for (let i = 0; i < 4; i++) publish(payload);
  toast('已切换难度，等待对手同步…', 1800);
}

// ================= 分享 =================
function shareLink(){
  // 安卓 APP 内：以 APP 内置的线上分享基地址为准（本地 WebView 无可用 origin）
  if (window.AndroidBridge && window.AndroidBridge.getOnlineBase){
    try { return window.AndroidBridge.getOnlineBase() + '?room=' + encodeURIComponent(S.room) + '#' + S.room; } catch (e) {}
  }
  const base = location.origin + location.pathname;
  return base + '?room=' + encodeURIComponent(S.room) + '#' + S.room;
}
function copyText(txt){
  return new Promise(res => {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(() => res(true)).catch(() => res(fallbackCopy(txt)));
    } else res(fallbackCopy(txt));
  });
}
function fallbackCopy(txt){
  try {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}
const SHARE_TEXT = '🏆 来一局数独对战！\n同一道题，3-2-1 同时开跑；先完成且全部正确者 WINNER 🏆，另一方 LOSER。点开即玩，无需下载。';
async function doShare(){
  const link = shareLink();
  // 安卓 APP 内：调用原生分享面板（可直达微信等）
  if (window.AndroidBridge && window.AndroidBridge.share){
    try { window.AndroidBridge.share(link, SHARE_TEXT); return; } catch (e) {}
  }
  // 网页端：尝试系统分享，失败则复制链接
  try {
    if (navigator.share && !IS_WX){
      await navigator.share({ title: '数独对战', text: SHARE_TEXT, url: link });
      return;
    }
  } catch (e) {}
  await doCopyLink();
}
async function doCopyLink(){
  const link = shareLink();
  const ok = await copyText(link);
  if (ok){
    toast('已复制对战链接，去微信粘贴发送给好友', 3000);
  } else {
    $('warnText').textContent = '复制失败，请手动复制：' + link;
    $('warnBanner').style.display = 'flex';
    $('singleBtn').style.display = 'none';
  }
}

// ================= 等待期逻辑 =================
function startWaiting(){
  S.state = 'waiting';
  if (!S.firstJoinTs) S.firstJoinTs = Date.now();
  S.waitElapsed = 0;
  setMyState('等待坐下…');
  $('oppTimer').textContent = '--:--';
  setOppState('等待中…');
  // 坐下按钮：等待阶段显示，坐下后禁用
  const sr = $('sitRow'); if (sr) sr.style.display = 'block';
  const sb = $('sitBtn');
  if (sb){ sb.disabled = S.mySit; sb.textContent = S.mySit ? '已坐下 ✓' : '🪑 坐下'; }
  const joinPayload = () => ({
    type: 'join', cid: S.myCid, name: S.myName,
    ts: S.firstJoinTs, difficulty: S.difficulty, seed: S.seed
  });
  publish(joinPayload());
  S.joinTimer = setInterval(() => {
    S.waitElapsed += 6;
    if (S.state !== 'waiting'){ clearInterval(S.joinTimer); return; }
    publish(joinPayload());   // 每 6 秒重发一次 join，防配对失败
    if (S.waitElapsed >= 20 && !S.rotated){
      // 20 秒未等到对手：提示刷新重试；同时自动轮换到下一台公共 broker，
      // 防止双方落在不同 broker 上而无法互通
      S.rotated = true;
      $('warnBanner').style.display = 'flex';
      $('warnText').textContent = '20 秒内未等到对手：请双方都刷新页面重试。';
      rotateBroker();
    }
    if (S.waitElapsed >= 90){
      clearInterval(S.joinTimer);
      enterSingle('未检测到对手，已进入单人练习模式');
    }
  }, 6000);
}
function rotateBroker(){
  if (!S.mqttOnline || S.peer) return;
  const cur = BROKERS.findIndex(b => b.name === S.brokerName);
  if (cur === -1) return;
  const next = (cur + 1) % BROKERS.length;
  toast('正在切换服务器 ' + BROKERS[next].name + ' …', 2000);
  try { S.mqtt.end(true); } catch (e) {}
  S.mqttOnline = false;
  setConn(false, '切换中…');
  S.rotated = false;
  S.waitElapsed = 0;
  connectMQTTFrom(next).then(() => {
    if (S.mqttOnline && S.state === 'waiting'){
      clearInterval(S.joinTimer);
      startWaiting();
    }
  });
}

// ================= 初始化 =================
function init(){
  $('roomTag').textContent = S.room;
  $('diffLabel').textContent = '';
  document.title = '数独对战 · ' + S.room;
  if (IS_WX && !resolveName() && !params.get('name') && !params.get('nickname') && !params.get('wxname')){
    $('nameInput').placeholder = '微信用户';
  }
  if (!S.myName){
    showNameModal();
  } else {
    $('myNameTxt').textContent = S.myName;
    boot();
  }
}
function showNameModal(){
  $('modal').classList.add('show');
  $('nameInput').value = '';
  $('nameInput').focus();
  const finish = () => {
    const v = ($('nameInput').value || '').trim();
    S.myName = v || (IS_WX ? '微信用户' : '玩家' + Math.floor(1000 + Math.random() * 9000));
    try { localStorage.setItem('sb_name', S.myName); } catch(e){}
    $('modal').classList.remove('show');
    $('myNameTxt').textContent = S.myName;
    boot();
  };
  $('modalOk').onclick = finish;
  $('modalCancel').onclick = () => {
    S.myName = IS_WX ? '微信用户' : '玩家' + Math.floor(1000 + Math.random() * 9000);
    try { localStorage.setItem('sb_name', S.myName); } catch(e){}
    $('modal').classList.remove('show');
    $('myNameTxt').textContent = S.myName;
    boot();
  };
  $('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') finish(); });
}
function boot(){
  // 1) 载入注入题（或自动生成）
  if (INJECTED && INJECTED.puzzle){
    S.seed = INJECTED.seed || ('inject-' + INJECTED.gameId);
    S.injectedSeed = S.seed;
    S.difficulty = INJECTED.difficulty || 'medium';
    S.injectedDiff = S.difficulty;
    S.puzzle = INJECTED.puzzle; S.solution = INJECTED.solution;
    S.givens = INJECTED.givens || countGivens(S.puzzle);
    buildBoardFromPuzzle();
  } else {
    S.seed = randomSeed();
    S.injectedSeed = null;
    const g = generatePuzzle(S.seed, S.difficulty);
    S.puzzle = g.puzzle; S.solution = g.solution; S.givens = g.givens;
    buildBoardFromPuzzle();
  }
  updateDiffUI();
  renderPlayers();
  S.firstJoinTs = Date.now();

  // 2) 连接实时通道
  connectMQTT().then(() => {
    if (S.mqttOnline && S.state === 'init'){
      startWaiting();
    }
  });

  // 3) 事件绑定
  document.querySelectorAll('#diffRow button').forEach(b => {
    b.addEventListener('click', () => changeDifficulty(b.dataset.diff));
  });
  document.querySelectorAll('.pad [data-n]').forEach(b => {
    b.addEventListener('click', () => {
      if (S.selected === null){ toast('先点选一个格子', 1200); return; }
      setValue(S.selected, parseInt(b.dataset.n, 10));
    });
  });
  $('eraseBtn').addEventListener('click', eraseCell);
  $('noteBtn').addEventListener('click', () => {
    S.notesMode = !S.notesMode;
    $('noteBtn').classList.toggle('act', S.notesMode);
    toast(S.notesMode ? '笔记模式：点数字添加候选数' : '已退出笔记模式', 1200);
  });
  $('hintBtn').addEventListener('click', doHint);
  $('restartBtn').addEventListener('click', doRestart);
  $('surrBtn').addEventListener('click', doSurrender);
  $('shareBtn').addEventListener('click', doShare);
  $('bigShareBtn').addEventListener('click', doCopyLink);
  $('resultBtn').addEventListener('click', () => { closeResult(); doRestart(); });
  $('sitBtn').addEventListener('click', sitDown);
  $('singleBtn').addEventListener('click', () => { $('warnBanner').style.display = 'none'; enterSingle('已进入单人练习模式'); });
  document.addEventListener('keydown', e => {
    if (e.key >= '1' && e.key <= '9' && S.selected !== null){
      setValue(S.selected, parseInt(e.key, 10));
    } else if ((e.key === 'Backspace' || e.key === 'Delete') && S.selected !== null){
      eraseCell();
    }
  });
}
function countGivens(p){ let n = 0; for (const row of p) for (const v of row) if (v) n++; return n; }

// ================= 启动 =================
init();

// ================= PWA Service Worker =================
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
